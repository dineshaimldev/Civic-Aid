services:
  - type: web
    name: civicaid-api
    env: python
    region: singapore
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python scripts/build_index.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: REMINDER_SWEEP_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://civicaid.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract
