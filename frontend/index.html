    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      body { background: #f4f1e9; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker only registers in production builds — never in dev mode.
      // This prevents Vite's dev server changes from being masked by a stale cache.
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      } else if ('serviceWorker' in navigator) {
        // Dev mode: actively unregister any previously-registered service worker
        // and clear its caches so old bundles can never be served again.
        navigator.serviceWorker.getRegistrations().then(regs => {
          regs.forEach(reg => reg.unregister())
        })
        if (window.caches) {
          caches.keys().then(keys => keys.forEach(k => caches.delete(k)))
        }
      }
    </script>
  </body>
